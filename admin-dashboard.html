<section class="admin-dashboard" id="admin-dashboard" hidden><div class="admin-heading"><div><p class="eyebrow">CONTROL ROOM / 01</p><h2>Manage your <i>inventory.</i></h2></div><div class="admin-actions"><button class="close-admin" id="close-admin" type="button">Back to shop &times;</button><button class="close-admin admin-logout" id="admin-logout" type="button">Sign out</button></div></div><div class="admin-layout"><form class="product-form" id="product-form"><p class="form-title">Add a product</p><label>Product name<input name="name" placeholder="e.g. Carbon Rear Diffuser" required></label><label>Category<select name="category" required><option value="wheels">Wheels</option><option value="audio">Audio</option><option value="exterior">Exterior</option><option value="interior">Interior</option><option value="tint">Tint</option><option value="lights">Lights</option></select></label><label>Description<textarea name="description" placeholder="What makes this upgrade special?" rows="3" required></textarea></label><label>Details<input name="meta" placeholder="Finish / size / fitment" required></label><label>Vehicle compatibility<input name="compatibility" placeholder="e.g. Toyota Hilux 2016-2024" required></label><label>Price (MWK)<input name="price" type="number" min="0" step="1" placeholder="299000" required></label><label>Stock quantity<input name="stock" type="number" min="0" step="1" placeholder="10" required></label><label>Product image<input name="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required><small class="form-hint">Choose a photo from this device · JPEG, PNG, WebP or GIF · Max 5 MB</small><img class="image-preview" id="image-preview" alt="Selected product preview" hidden></label><label class="checkbox-label"><input name="badge" type="checkbox"> Mark as new</label><button class="button button-dark" type="submit">Add to inventory <span>+</span></button></form><div class="inventory-panel"><div class="inventory-summary"><p class="form-title">Current inventory <span id="inventory-count">0 items</span></p><input id="inventory-search" type="search" placeholder="Search inventory"></div><div class="inventory-list" id="inventory-list"></div></div></div><section class="orders-panel" aria-labelledby="admin-orders-title"><div class="orders-heading"><p class="form-title" id="admin-orders-title">Customer orders <span id="admin-order-count">0 orders</span></p><button class="orders-refresh" id="refresh-orders" type="button">Refresh orders</button></div><p class="orders-status" id="orders-status" aria-live="polite">Orders appear here after a customer checks out.</p><div class="admin-orders-list" id="admin-orders-list"></div></section></section>
