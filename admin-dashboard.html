<section class="admin-dashboard" id="admin-dashboard" hidden><div class="admin-heading"><div><p class="eyebrow">CONTROL ROOM</p><h2>Manage your <i>store.</i></h2></div><div class="admin-actions"><button class="close-admin" id="close-admin" type="button">Back to shop &times;</button><button class="close-admin admin-logout" id="admin-logout" type="button">Sign out</button></div></div><nav class="admin-sections" aria-label="Admin sections"><button class="admin-section-link active" data-admin-view="inventory" type="button" aria-current="page">Inventory</button><button class="admin-section-link" data-admin-view="offers" type="button">Offers</button><button class="admin-section-link" data-admin-view="orders" type="button">Orders</button><button class="admin-section-link" data-admin-view="customers" type="button">Customers</button></nav><div class="admin-view" id="admin-view-inventory"><div class="admin-layout"><form class="product-form" id="product-form"><p class="form-title">Add a product</p><label>Product name<input name="name" placeholder="e.g. Carbon Rear Diffuser" required></label><label>Category<select name="category" required><option value="wheels">Wheels</option><option value="audio">Audio</option><option value="exterior">Exterior</option><option value="interior">Interior</option><option value="tint">Tint</option><option value="lights">Lights</option></select></label><label>Description<textarea name="description" placeholder="What makes this upgrade special?" rows="3" required></textarea></label><label>Details<input name="meta" placeholder="Finish / size / fitment" required></label><label>Vehicle compatibility<input name="compatibility" placeholder="e.g. Toyota Hilux 2016-2024" required></label><label>Price (MWK)<input name="price" type="number" min="0" step="1" placeholder="299000" required></label><label>Stock quantity<input name="stock" type="number" min="0" step="1" placeholder="10" required></label><label>Product image<input name="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required><small class="form-hint">Choose a photo from this device · JPEG, PNG, WebP or GIF · Max 5 MB</small><img class="image-preview" id="image-preview" alt="Selected product preview" hidden></label><label class="checkbox-label"><input name="badge" type="checkbox"> Mark as new</label><button class="button button-dark" type="submit">Add to inventory <span>+</span></button></form><div class="inventory-panel"><div class="inventory-summary"><p class="form-title">Current inventory <span id="inventory-count">0 items</span></p><input id="inventory-search" type="search" placeholder="Search inventory"></div><div class="inventory-list" id="inventory-list"></div></div></div></div><section class="offers-panel admin-view" id="admin-view-offers" aria-labelledby="admin-offers-title" hidden><div class="orders-heading"><p class="form-title" id="admin-offers-title">Manage offers <span id="admin-offer-count">0 products</span></p><input class="offer-search" id="admin-offer-search" type="search" placeholder="Search products" aria-label="Search products"></div><p class="orders-status" id="admin-offers-status" aria-live="polite">Choose which products appear in customer offers.</p><div class="admin-offers-list" id="admin-offer-list"></div></section><section class="orders-panel admin-view" id="admin-view-orders" aria-labelledby="admin-orders-title" hidden><div class="orders-heading"><p class="form-title" id="admin-orders-title">Customer orders <span id="admin-order-count">0 orders</span></p><button class="orders-refresh" id="refresh-orders" type="button">Refresh orders</button></div><p class="orders-status" id="orders-status" aria-live="polite">Orders appear here after a customer checks out.</p><div class="admin-orders-list" id="admin-orders-list"></div></section><section class="customers-panel admin-view" id="admin-view-customers" aria-labelledby="admin-customers-title" hidden><div class="orders-heading"><p class="form-title" id="admin-customers-title">Customers <span id="admin-customer-count">0 customers</span></p><input class="customer-search" id="customer-search" type="search" placeholder="Search customers" aria-label="Search customers"></div><p class="orders-status" id="customers-status" aria-live="polite">Customers appear here after placing an order.</p><div class="admin-customers-list" id="admin-customers-list"></div></section></section>
